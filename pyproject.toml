[project]
name = "jackathon"
version = "0.1.0"
description = "A team of AI agents that helps you research, build, pitch and ship a winning hackathon project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "playwright>=1.45",
    "python-pptx>=1.0",
    "pypdf>=4.0",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jackathon = "jackathon.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jackathon*"]

[tool.setuptools.package-data]
jackathon = ["templates/**/*", "templates/**/.*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
